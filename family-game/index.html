<!doctype html>
<!--standalone-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211A3F">
<meta name="description" content="Five quick brain games for the whole family. Everyone plays at their own level.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain Cup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
  body { margin: 0; font: 14px system-ui, sans-serif }
  img { max-width: 100% }
  [hidden] { display: none !important }
</style>
<!--/standalone-->
<title>Family Brain Cup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one centred column like a game table at night; menus scroll, play screens fit one viewport. */
:root {
  --board: #211A3F;
  --board-2: #2C2356;
  --board-3: #3A2F6B;
  --ink: #FFF6E6;
  --muted: #B8ADD9;
  --line: rgba(255, 246, 230, .14);
  --sun: #FFC83D;
  --sun-deep: #C48F12;
  --sun-ink: #3B2A00;
  --coral: #FF6A5C;
  --mint: #36D6A4;
  --sky: #4AB3FF;
  --grape: #B48CFF;
  --good: #36D6A4;
  --bad: #FF6A5C;
  --f-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
html, body { height: 100% }
body {
  background:
    radial-gradient(circle at 1px 1px, rgba(255, 246, 230, .06) 1px, transparent 0) 0 0 / 22px 22px,
    var(--board);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit }
button { touch-action: manipulation; cursor: pointer }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance }

.shell {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 24px;
  box-sizing: border-box;
}
.bar { display: flex; align-items: center; gap: 12px; min-height: 52px }
.bar-title { flex: 1; text-align: center; font-family: var(--f-display); font-size: 18px; color: var(--muted); letter-spacing: .02em }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--board-2);
  display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.icon-btn[aria-pressed="false"] svg { stroke: var(--muted) }
main { flex: 1; display: flex; flex-direction: column; gap: 22px; padding-top: 8px }

/* Buttons */
.btn {
  border: 0; border-radius: 16px; padding: 14px 22px; min-height: 56px;
  font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .01em;
  background: var(--board-3); color: var(--ink);
  box-shadow: 0 5px 0 rgba(0, 0, 0, .35);
  transition: transform .08s, box-shadow .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .35) }
.btn.primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 5px 0 var(--sun-deep) }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--sun-deep) }
.btn.ghost { background: transparent; border: 2px solid var(--line); box-shadow: none }
.btn.danger { background: var(--coral); color: #2B0500; box-shadow: 0 5px 0 #A83126 }
.btn.big { font-size: 24px; min-height: 68px; padding-inline: 28px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.wide { width: 100% }
.row { display: flex; gap: 12px; flex-wrap: wrap }
.row > .btn { flex: 1 1 160px }

.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 800 }
.muted { color: var(--muted) }
.section { display: flex; flex-direction: column; gap: 12px }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }

/* Home */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding-top: 6px }
.hero svg { width: clamp(88px, 22vw, 132px); height: auto; animation: bob 3.2s ease-in-out infinite }
.hero h1 { font-size: clamp(40px, 9vw, 64px); color: var(--sun); letter-spacing: -.01em }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 34ch }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg) } }

.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.pcard {
  display: flex; align-items: center; gap: 10px; text-align: left;
  border: 2px solid var(--line); border-radius: var(--r); background: var(--board-2);
  padding: 10px 12px; min-height: 64px; min-width: 0;
}
.pcard .who { min-width: 0 }
.pcard .name { font-family: var(--f-display); font-size: 20px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.avatar {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 28px;
  background: color-mix(in srgb, var(--t, var(--sky)) 28%, var(--board-3));
  box-shadow: inset 0 0 0 3px var(--t, var(--sky));
}
.avatar.xl { width: 120px; height: 120px; font-size: 72px; box-shadow: inset 0 0 0 6px var(--t) }
.add-card { justify-content: center; border-style: dashed; color: var(--muted); font-family: var(--f-display); font-size: 19px }
.tier-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: var(--t);
}
.tier-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--t) }
[data-tier="star"] { --t: var(--sun) }
[data-tier="explorer"] { --t: var(--mint) }
[data-tier="master"] { --t: var(--coral) }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.level { border-radius: var(--r); padding: 14px; background: var(--board-2); border-top: 6px solid var(--t); min-width: 0 }
.level h3 { font-size: 21px; color: var(--t) }
.level .ages { font-size: 14px; color: var(--ink) }
.level p { margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.35 }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.gtile {
  display: flex; gap: 12px; align-items: center; text-align: left;
  padding: 12px; border-radius: var(--r); background: var(--board-2); border: 2px solid transparent; min-width: 0;
}
.gtile .gicon {
  width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 26px;
  background: var(--g);
}
.gtile b { font-family: var(--f-display); font-size: 19px; font-weight: 800; display: block; line-height: 1.1 }
.gtile span { font-size: 13.5px; color: var(--muted); line-height: 1.3; display: block }
.gtile.selectable[aria-pressed="true"] { border-color: var(--g); background: color-mix(in srgb, var(--g) 16%, var(--board-2)) }
.gtile.selectable[aria-pressed="false"] { opacity: .55 }
[data-game="math"] { --g: var(--sky) }
[data-game="memory"] { --g: var(--grape) }
[data-game="words"] { --g: var(--mint) }
[data-game="pattern"] { --g: var(--coral) }
[data-game="eyes"] { --g: var(--sun) }

.install-tip { border: 2px dashed var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 15px; color: var(--muted) }
.install-tip b { color: var(--ink) }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 800 }
.input {
  font-size: 22px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--board-2); min-height: 56px; box-sizing: border-box; width: 100%;
  -webkit-user-select: text; user-select: text;
}
.input:focus { outline: none; border-color: var(--sky) }
.form-grid { display: grid; grid-template-columns: 1fr 120px; gap: 12px }
.avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px }
.avatars button {
  aspect-ratio: 1; font-size: clamp(24px, 6vw, 34px); border-radius: 14px; border: 2px solid var(--line); background: var(--board-2); padding: 0;
}
.avatars button[aria-pressed="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 22%, var(--board-2)) }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.seg button {
  border-radius: 14px; border: 2px solid var(--line); background: var(--board-2); padding: 10px 6px; min-height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.seg button b { font-family: var(--f-display); font-size: 18px; line-height: 1.1 }
.seg button small { font-size: 12.5px; color: var(--muted) }
.seg button[aria-pressed="true"] { border-color: var(--t, var(--sun)); background: color-mix(in srgb, var(--t, var(--sun)) 20%, var(--board-2)) }
.seg.numbers button b { font-size: 26px }
.pick-players { display: flex; flex-wrap: wrap; gap: 8px }
.pick-players button { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--board-2); font-family: var(--f-display); font-size: 18px; min-height: 52px }
.pick-players button .avatar { width: 38px; height: 38px; font-size: 22px }
.pick-players button[aria-pressed="true"] { border-color: var(--t) }
.pick-players button[aria-pressed="false"] { opacity: .5 }

/* Interstitials */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding-block: 12px }
.center h2 { font-size: clamp(34px, 8vw, 54px) }
.center p { margin: 0; color: var(--muted); max-width: 36ch }
.big-icon { width: 112px; height: 112px; border-radius: 30px; display: grid; place-items: center; font-size: 62px; background: var(--g); box-shadow: 0 8px 0 rgba(0,0,0,.3) }
.lineup { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px }
.lineup .pill { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--board-2) }
.lineup .avatar { width: 34px; height: 34px; font-size: 20px }
.points { font-family: var(--f-display); font-size: clamp(64px, 18vw, 110px); line-height: 1; color: var(--sun); font-variant-numeric: tabular-nums }
.detail { list-style: none; padding: 0; margin: 0; color: var(--muted) }

.standings { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 520px }
.stand { display: grid; grid-template-columns: 28px 46px 1fr auto; gap: 10px; align-items: center; text-align: left }
.stand .rank { font-family: var(--f-display); font-size: 22px; color: var(--muted) }
.stand .bar-wrap { min-width: 0 }
.stand .nm { font-family: var(--f-display); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stand .track { height: 10px; border-radius: 6px; background: var(--board-3); overflow: hidden }
.stand .track i { display: block; height: 100%; background: var(--t); border-radius: 6px; transform-origin: left; animation: grow .8s ease-out both }
.stand .sc { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums }
.stand .sc small { display: block; font-size: 13px; color: var(--mint); text-align: right; font-family: var(--f-body) }
@keyframes grow { from { transform: scaleX(0) } }

.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; width: 100%; max-width: 520px }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0 }
.step .block { width: 100%; border-radius: 14px 14px 4px 4px; background: var(--board-3); display: grid; place-items: center; font-family: var(--f-display); font-size: 34px; color: var(--muted); border-top: 6px solid var(--t) }
.step.p1 .block { height: 130px; background: color-mix(in srgb, var(--sun) 30%, var(--board-3)); color: var(--sun) }
.step.p2 .block { height: 96px }
.step.p3 .block { height: 70px }
.step .nm { font-family: var(--f-display); font-size: 18px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.step .sc { color: var(--muted); font-variant-numeric: tabular-nums }

/* Play */
.play { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0 }
.play-head { display: flex; align-items: center; gap: 10px }
.play-head .avatar { width: 42px; height: 42px; font-size: 24px }
.play-head .who { flex: 1; min-width: 0 }
.play-head .name { font-family: var(--f-display); font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.live { font-family: var(--f-display); font-size: 34px; color: var(--sun); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right }
.live.pop { animation: pop .35s }
@keyframes pop { 40% { transform: scale(1.3) } }
.timer { height: 12px; border-radius: 8px; background: var(--board-3); overflow: hidden }
.timer i { display: block; height: 100%; background: var(--mint); transform-origin: left; border-radius: 8px }
.timer i.low { background: var(--coral) }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; min-height: 0 }
.q-count { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .12em }
.q-label { font-family: var(--f-display); font-size: 26px }
.q-big { font-family: var(--f-display); font-size: clamp(44px, 12vw, 76px); line-height: 1.1; font-variant-numeric: tabular-nums }
.q-help { font-size: 30px; letter-spacing: 2px; line-height: 1.3; max-width: 100% }
.q-help s { opacity: .25; text-decoration: none }
.count-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; font-size: clamp(38px, 10vw, 56px); max-width: 520px }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 560px }
.choice {
  min-height: 84px; border-radius: 18px; border: 0; background: var(--board-3);
  font-family: var(--f-display); font-size: clamp(30px, 8vw, 42px); font-weight: 800; font-variant-numeric: tabular-nums;
  box-shadow: 0 5px 0 rgba(0,0,0,.35);
}
.choice:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35) }
.choice.right { background: var(--good); color: #002A1C }
.choice.wrong { background: var(--bad); color: #2B0500; animation: shake .4s }
.choice:disabled { cursor: default }
.seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100% }
.seq span {
  min-width: 58px; height: 64px; padding: 0 10px; box-sizing: border-box; border-radius: 14px; background: var(--board-2);
  display: grid; place-items: center; font-family: var(--f-display); font-size: 32px; font-variant-numeric: tabular-nums;
}
.seq span.ask { background: transparent; border: 3px dashed var(--coral); color: var(--coral) }

/* Words */
.hint-emoji { font-size: clamp(80px, 22vw, 120px); line-height: 1 }
.hint-text { font-size: 22px; max-width: 26ch; line-height: 1.3 }
.slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100% }
.slot, .tile {
  width: clamp(40px, 10.5vw, 60px); height: clamp(50px, 12.5vw, 68px); border-radius: 12px;
  display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(26px, 7vw, 38px); padding: 0;
}
.slot { border: 0; background: var(--board-2); border-bottom: 4px solid var(--line) }
.slot.locked { color: var(--mint) }
.slots.ok .slot { background: var(--good); color: #002A1C }
.slots.no { animation: shake .4s }
.tile { border: 0; background: var(--ink); color: var(--board); box-shadow: 0 5px 0 #B9A98C }
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 #B9A98C }
.tile.used { visibility: hidden }
@keyframes shake { 20%, 60% { transform: translateX(-8px) } 40%, 80% { transform: translateX(8px) } }

/* Memory */
.mgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; width: 100%; max-width: min(100%, calc((100dvh - 230px) * var(--cols) / var(--rows) * .82)) }
.card { aspect-ratio: 4 / 5; border: 0; padding: 0; background: none; perspective: 600px }
.card .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d }
.card.up .in, .card.done .in { transform: rotateY(180deg) }
.card .face, .card .back { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden }
.card .back { background: var(--grape); box-shadow: inset 0 0 0 4px rgba(255,255,255,.25); background-image: radial-gradient(circle, rgba(255,255,255,.35) 2px, transparent 3px); background-size: 16px 16px }
.card .face { background: var(--ink); transform: rotateY(180deg); font-size: clamp(30px, 9vw, 52px) }
.card.done .face { background: color-mix(in srgb, var(--good) 45%, var(--ink)) }

/* Sharp eyes */
.egrid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; width: 100%; max-width: min(100%, calc(100dvh - 250px)) }
.egrid button { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--board-2); padding: 0; font-size: calc(min(100vw, 560px) / var(--n) * .52); line-height: 1 }
.egrid button.right { background: var(--good) }
.egrid button.wrong { background: var(--bad); animation: shake .3s }

.table-wrap { overflow-x: auto; width: 100% }
table.fame { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
.fame th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); text-align: right; padding: 6px 8px; font-weight: 800 }
.fame th:first-child, .fame td:first-child { text-align: left }
.fame td { padding: 10px 8px; border-top: 1px solid var(--line); text-align: right; font-size: 17px }
.fame .who { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 19px; white-space: nowrap }
.fame .avatar { width: 34px; height: 34px; font-size: 20px }

.modal { position: fixed; inset: 0; background: rgba(10, 6, 25, .7); display: grid; place-items: center; z-index: 30; padding: 20px }
.sheet { background: var(--board-2); border-radius: 22px; padding: 22px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 18px; text-align: center; border: 2px solid var(--line) }
.sheet p { margin: 0; font-size: 19px }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100% }

@media (max-width: 560px) {
  .levels { grid-template-columns: 1fr }
  .level { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; border-top: 0; border-left: 6px solid var(--t) }
  .level p { margin: 0; grid-column: 2; grid-row: 1 / span 2; align-self: center }
  .form-grid { grid-template-columns: 1fr 96px }
  .choice { min-height: 76px }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important }
}
</style>
<!--standalone-->
</head>
<body>
<!--/standalone-->
<div class="shell">
  <header class="bar">
    <button class="icon-btn" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    </button>
    <div class="bar-title" id="barTitle"></div>
    <button class="icon-btn" id="soundBtn" aria-label="Sound" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button>
  </header>
  <main id="app"></main>
</div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- sound ---------- */
const Sound = (() => {
  let ctx;
  const ensure = () => {
    if (!S.sound) return null;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch { return null; }
    return ctx;
  };
  const tone = (freq, dur = .12, type = 'sine', when = 0, vol = .15) => {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  };
  return {
    unlock: ensure,
    tap: () => tone(660, .06, 'triangle', 0, .08),
    good: () => { tone(784, .1, 'triangle'); tone(1047, .16, 'triangle', .08); },
    bad: () => { tone(220, .18, 'sawtooth', 0, .06); tone(170, .22, 'sawtooth', .1, .05); },
    flip: () => tone(520, .05, 'square', 0, .035),
    tick: () => tone(1250, .03, 'square', 0, .03),
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .24, 'triangle', i * .12, .13)),
  };
})();
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* not supported */ } };

function go(render, ...args) {
  if (S.cleanup) { S.cleanup(); S.cleanup = null; }
  S.inPlay = false;
  app.innerHTML = '';
  window.scrollTo(0, 0);
  render(...args);
}

function ask(msg, yes, no) {
  return new Promise(res => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p>${esc(msg)}</p>
      <div class="row"><button class="btn ghost" data-a="0">${esc(no)}</button><button class="btn danger" data-a="1">${esc(yes)}</button></div></div>`;
    document.body.append(m);
    $('[data-a="0"]', m).focus();
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      m.remove();
      res(b.dataset.a === '1');
    });
  });
}

function playerForm(id) {
  const existing = id ? byId(id) : null;
  const used = new Set(S.players.map(p => p.avatar));
  const draft = existing ? { ...existing } : { id: uid(), name: '', age: '', tier: 'explorer', avatar: AVATARS.find(a => !used.has(a)) || AVATARS[0], stats: { cups: 0, played: 0, best: {} } };
  let tierTouched = !!existing;
  setTitle(existing ? 'Edit player' : 'New player');

  app.innerHTML = `
    <form class="section" id="pf" autocomplete="off">
      <div class="form-grid">
        <div class="field"><label for="pname">Name</label><input class="input" id="pname" maxlength="14" dir="auto" placeholder="e.g. Sara" value="${esc(draft.name)}" required></div>
        <div class="field"><label for="page">Age</label><input class="input" id="page" type="number" inputmode="numeric" min="3" max="120" placeholder="11" value="${esc(draft.age)}"></div>
      </div>
      <div class="field"><label>Level</label>
        <div class="seg" id="tierSeg">${Object.entries(TIERS).map(([t, v]) => `<button type="button" data-tier="${t}" aria-pressed="${t === draft.tier}"><b>${v.name}</b><small>${v.ages}</small></button>`).join('')}</div>
      </div>
      <div class="field"><label>Pick an animal</label>
        <div class="avatars" id="avs">${AVATARS.map(a => `<button type="button" aria-pressed="${a === draft.avatar}" aria-label="${a}">${a}</button>`).join('')}</div>
      </div>
      <div class="row">
        ${existing ? '<button type="button" class="btn ghost" id="del">Remove</button>' : ''}
        <button type="submit" class="btn primary">${existing ? 'Save' : 'Add player'}</button>
      </div>
    </form>`;

  const paintTier = () => $$('#tierSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tier === draft.tier)));
  $('#page').addEventListener('input', e => {
    const a = parseInt(e.target.value, 10);
    if (!tierTouched && a > 0) { draft.tier = tierForAge(a); paintTier(); }
  });
  $$('#tierSeg button').forEach(b => b.onclick = () => { draft.tier = b.dataset.tier; tierTouched = true; paintTier(); Sound.tap(); });
  $$('#avs button').forEach(b => b.onclick = () => { draft.avatar = b.textContent; $$('#avs button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); Sound.tap(); });
  if (existing) $('#del').onclick = async () => {

    }

    e.preventDefault();
    draft.name = $('#pname').value.trim().slice(0, 14);

    draft.age = a > 0 ? a : '';
    if (existing) Object.assign(existing, draft); else S.players.push(draft);
    savePlayers(); Sound.good(); go(home);
  });
  if (!existing) $('#pname').focus();
}

/* ================= CUP ================= */
function cupSetup() {
  setTitle('New cup');
  const chosen = new Set(S.players.map(p => p.id));
  const games = new Set(Object.keys(GAMES));
  let rounds = 5;
  app.innerHTML = `
    <section class="section"><span class="eyebrow">Who is playing?</span>
      <div class="pick-players" id="pp">${S.players.map(p => `<button data-id="${p.id}" data-tier="${p.tier}" aria-pressed="true">${avatarHtml(p)}<span dir="auto">${esc(p.name)}</span></button>`).join('')}</div>
    </section>
    <section class="section"><span class="eyebrow">Rounds</span>
      <div class="seg numbers" id="rs">${[3, 5, 7].map(n => `<button data-n="${n}" aria-pressed="${n === rounds}"><b>${n}</b><small>${n === 3 ? 'about 5 min' : n === 5 ? 'about 10 min' : 'about 15 min'}</small></button>`).join('')}</div>
    </section>
    <section class="section"><span class="eyebrow">Games in this cup</span>
      <div class="games" id="gs">${Object.keys(GAMES).map(id => `<button class="gtile selectable" data-game="${id}" aria-pressed="true">${gameTile(id)}</button>`).join('')}</div>
    </section>
    <button class="btn primary big wide" id="go">Start the cup</button>`;

  const refresh = () => { $('#go').disabled = !chosen.size || !games.size; };
  $$('#pp button').forEach(b => b.onclick = () => { const id = b.dataset.id; chosen.has(id) ? chosen.delete(id) : chosen.add(id); b.setAttribute('aria-pressed', String(chosen.has(id))); Sound.tap(); refresh(); });
  $$('#rs button').forEach(b => b.onclick = () => { rounds = +b.dataset.n; $$('#rs button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); Sound.tap(); });
  $$('#gs button').forEach(b => b.onclick = () => { const id = b.dataset.game; games.has(id) ? games.delete(id) : games.add(id); b.setAttribute('aria-pressed', String(games.has(id))); Sound.tap(); refresh(); });
  $('#go').onclick = () => {
    const ids = S.players.filter(p => chosen.has(p.id)).map(p => p.id);
    const order = []; let pool = [];
    for (let r = 0; r < rounds; r++) { if (!pool.length) pool = shuffle([...games]); order.push(pool.pop()); }
    S.cup = { ids, order, round: 0, turn: 0, scores: Object.fromEntries(ids.map(i => [i, 0])), roundPts: {} };
    go(roundIntro);
  };
}

const turnOrder = () => { const c = S.cup, n = c.ids.length, k = c.round % n; return [...c.ids.slice(k), ...c.ids.slice(0, k)]; };

function roundIntro() {
  const c = S.cup, gid = c.order[c.round];
  setTitle(`Round ${c.round + 1} of ${c.order.length}`);
  c.turn = 0; c.roundPts = {};
  app.innerHTML = `<div class="center" data-game="${gid}">
    <span class="eyebrow">Round ${c.round + 1}</span>
    <div class="big-icon">${GAMES[gid].icon}</div>
    <h2>${GAMES[gid].name}</h2>
    <p>${GAMES[gid].how} Each player gets puzzles for their own level.</p>
    <div class="lineup">${turnOrder().map(id => { const p = byId(id); return `<span class="pill">${avatarHtml(p)}<span dir="auto">${esc(p.name)}</span></span>`; }).join('')}</div>
    <button class="btn primary big" id="go">Let's go</button></div>`;
  $('#go').onclick = () => go(handoff);
}

function handoff() {
  const c = S.cup, p = byId(turnOrder()[c.turn]);
  setTitle(`Round ${c.round + 1} of ${c.order.length}`);
  app.innerHTML = `<div class="center">
    ${S.cup.ids.length > 1 ? '<span class="eyebrow">Pass the device to</span>' : '<span class="eyebrow">Your turn</span>'}
    ${avatarHtml(p, 'xl')}
    <h2 dir="auto">${esc(p.name)}</h2>
    ${tierTag(p.tier)}
    <button class="btn primary big" id="go">I'm ready</button></div>`;
  $('#go').onclick = () => go(playGame, c.order[c.round], p, (score, detail) => {
    c.scores[p.id] += score;
    c.roundPts[p.id] = score;
    go(turnResult, p, score, detail);
  });
}

function turnResult(p, score, detail) {
  const c = S.cup, order = turnOrder();
  const nextP = c.turn + 1 < order.length ? byId(order[c.turn + 1]) : null;
  app.innerHTML = `<div class="center">
    <span class="eyebrow" dir="auto">${esc(p.name)} scored</span>
    <div class="points">+${score}</div>
    <ul class="detail">${detail.map(d => `<li>${esc(d)}</li>`).join('')}</ul>
    <p>Cup total: <b style="color:var(--ink)">${c.scores[p.id]}</b></p>
    <button class="btn primary big" id="go">${nextP ? `Next: ${esc(nextP.name)}` : 'See the scores'}</button></div>`;
  $('#go').onclick = () => {
    if (nextP) { c.turn++; go(handoff); }
    else go(roundScores);
  };
}

const ranked = () => S.cup.ids.map(byId).sort((a, b) => S.cup.scores[b.id] - S.cup.scores[a.id]);

function roundScores() {
  const c = S.cup, last = c.round + 1 >= c.order.length;
  const list = ranked(), top = Math.max(1, ...list.map(p => c.scores[p.id]));
  setTitle(`After round ${c.round + 1} of ${c.order.length}`);
  app.innerHTML = `<div class="center">
    <h2>Scoreboard</h2>
    <div class="standings">${list.map((p, i) => `<div class="stand" data-tier="${p.tier}">
      <span class="rank">${i + 1}</span>${avatarHtml(p)}
      <span class="bar-wrap"><span class="nm" dir="auto">${esc(p.name)}</span><span class="track"><i style="width:${(c.scores[p.id] / top) * 100}%"></i></span></span>
      <span class="sc">${c.scores[p.id]}<small>+${c.roundPts[p.id] || 0}</small></span></div>`).join('')}</div>
    <button class="btn primary big" id="go">${last ? 'Crown the winner' : `Round ${c.round + 2}: ${GAMES[c.order[c.round + 1]].name}`}</button></div>`;
  $('#go').onclick = () => {
    if (last) go(finale);
    else { c.round++; go(roundIntro); }
  };
}

function finale() {
  const c = S.cup, list = ranked();
  const best = c.scores[list[0].id];
  const winners = list.filter(p => c.scores[p.id] === best);
  const rankOf = p => 1 + list.filter(q => c.scores[q.id] > c.scores[p.id]).length;
  list.forEach(p => { p.stats.played++; });
  winners.forEach(p => { p.stats.cups++; });
  savePlayers();
  setTitle('Cup finished');
  const podium = [list[1], list[0], list[2]].map((p, i) => p ? `<div class="step p${[2, 1, 3][i]}" data-tier="${p.tier}">
      ${avatarHtml(p)}<span class="nm" dir="auto">${esc(p.name)}</span><span class="sc">${c.scores[p.id]}</span>
      <span class="block">${rankOf(p)}</span></div>` : '').join('');
  const names = winners.map(p => esc(p.name)).join(' & ');
  app.innerHTML = `<div class="center">
    <span class="eyebrow">${winners.length > 1 ? 'A shared victory' : 'The cup goes to'}</span>
    <h2 dir="auto" style="color:var(--sun)">${names}</h2>
    <div class="podium">${podium}</div>
    ${list.length > 3 ? `<p>${list.slice(3).map(p => `${esc(p.name)} ${c.scores[p.id]}`).join(' · ')}</p>` : ''}
    <div class="row" style="width:100%;max-width:520px">
      <button class="btn" id="home2">Home</button>
      <button class="btn primary" id="again">Play again</button>
    </div></div>`;
  S.cup = null;
  Sound.win(); confetti();
  $('#home2').onclick = () => go(home);
  $('#again').onclick = () => go(cupSetup);
}

function practiceRun(gid, who) {
  const p = byId(who);
  go(playGame, gid, p, (score, detail) => go(() => {
    setTitle('Practice');
    const prev = p.stats.best[gid] || 0;
    app.innerHTML = `<div class="center">
      <span class="eyebrow">${GAMES[gid].name}</span>
      <div class="points">${score}</div>
      <ul class="detail">${detail.map(d => `<li>${esc(d)}</li>`).join('')}</ul>
      <p>${score > prev ? (prev ? `New personal best! Old best was ${prev}.` : 'First score on the board!') : `Personal best: ${prev}`}</p>
      <div class="row" style="width:100%;max-width:520px">
        <button class="btn" id="other">Other games</button>
        <button class="btn primary" id="again">Play again</button>
      </div></div>`;
    if (score > prev) { Sound.win(); confetti(); }
    $('#other').onclick = () => go(practiceSetup, who);
    $('#again').onclick = () => practiceRun(gid, who);
  }));
}

/* ================= GAME RUNNER ================= */
function makeTimer(fill) {
  let raf = null, t0 = 0, limit = 1, onEnd = null, lastTick = null;
  const frame = now => {
    const left = Math.max(0, limit - (now - t0) / 1000);
    fill.style.transform = `scaleX(${left / limit})`;
    fill.classList.toggle('low', left < limit * .25);
    const s = Math.ceil(left);
    if (left <= 3 && left > 0 && s !== lastTick) { lastTick = s; Sound.tick(); }
    if (left <= 0) { raf = null; onEnd && onEnd(); return; }
    raf = requestAnimationFrame(frame);
  };
  return {
    start(sec, cb) { this.stop(); limit = sec; onEnd = cb; t0 = performance.now(); lastTick = null; raf = requestAnimationFrame(frame); },
    stop() { if (raf) cancelAnimationFrame(raf); raf = null; },
    frac() { return raf ? Math.max(0, limit - (performance.now() - t0) / 1000) / limit : 0; },
  };
}

function playGame(gid, player, done) {
  S.inPlay = true;
  setTitle(GAMES[gid].name);
  app.innerHTML = `<div class="play">
    <div class="play-head">${avatarHtml(player)}<div class="who"><div class="name" dir="auto">${esc(player.name)}</div>${tierTag(player.tier)}</div><div class="live" id="live">0</div></div>
    <div class="timer"><i id="tfill"></i></div>
    <div class="stage" id="stage"></div></div>`;
  const timers = new Set();
  const live = $('#live');
  let finished = false;
  const ctx = {
    tier: player.tier,
    stage: $('#stage'),
    score: 0,
    timer: makeTimer($('#tfill')),
    add(n) {
      ctx.score = Math.max(0, ctx.score + n);
      live.textContent = Math.round(ctx.score);
      live.classList.remove('pop'); void live.offsetWidth; live.classList.add('pop');
    },
    later(fn, ms) { const h = setTimeout(() => { timers.delete(h); fn(); }, ms); timers.add(h); },
    done(detail) {
      if (finished) return; finished = true;
      const score = Math.min(100, Math.round(ctx.score));
      const best = player.stats.best;
      if (score > (best[gid] || 0)) { best[gid] = score; savePlayers(); }
      S.inPlay = false;
      ctx.later(() => done(score, detail), 500);
    },
  };
  S.cleanup = () => { ctx.timer.stop(); timers.forEach(clearTimeout); timers.clear(); finished = true; };
  RUN[gid](ctx);
}

/* Multiple-choice runner shared by Number Sprint and What Comes Next */
function quiz(ctx, make, time, count = 5) {
  let i = 0, right = 0;
  const next = () => {
    if (i >= count) return ctx.done([`${right} of ${count} correct`]);
    const q = make(ctx.tier); i++;
    ctx.stage.innerHTML = `<div class="q-count">Question ${i} of ${count}</div>${q.prompt}
      <div class="choices">${q.choices.map((c, k) => `<button class="choice" data-k="${k}">${c}</button>`).join('')}</div>`;
    const btns = $$('.choice', ctx.stage);
    let locked = false;
    const answer = k => {
      if (locked) return; locked = true;
      const f = ctx.timer.frac(); ctx.timer.stop();
      const ok = k !== null && q.choices[k] === q.answer;
      btns.forEach((b, j) => { b.disabled = true; if (q.choices[j] === q.answer) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      if (ok) { right++; ctx.add(10 + Math.round(10 * f)); Sound.good(); }
      else { Sound.bad(); buzz(80); }
      ctx.later(next, ok ? 700 : 1400);
    };
    btns.forEach((b, k) => b.onclick = () => answer(k));
    ctx.timer.start(time, () => answer(null));
  };
  next();
}

/* Four distinct numeric choices around the answer */
function numChoices(ans, spread, extra = [], min = 0) {
  const set = new Set([ans]);
  extra.forEach(v => { if (v >= min && set.size < 4) set.add(v); });
  let guard = 0;
  while (set.size < 4 && guard++ < 200) {
    const v = ans + pick(spread) * (Math.random() < .5 ? -1 : 1);
    if (v >= min) set.add(v);
  }
  for (let d = 1; set.size < 4; d++) set.add(ans + d);
  return { choices: shuffle([...set]).map(String), answer: String(ans) };
}

function wordGame(ctx) {
  const tier = ctx.tier, time = { star: 50, explorer: 45, master: 50 }[tier];
  const words = shuffle(WORDS[tier]).slice(0, 3);
  let w = 0, solved = 0;
  const next = () => {
    if (w >= words.length) return ctx.done([`${solved} of ${words.length} words spelled`]);
    const [word, hint] = words[w++];
    let letters; do { letters = shuffle(word.split('')); } while (letters.join('') === word);
    const slots = Array(word.length).fill(null); // tile index per slot
    const locked = new Set();
    let hints = 0, busy = false;
    ctx.stage.innerHTML = `<div class="q-count">Word ${w} of ${words.length}</div>
      ${tier === 'star' ? `<div class="hint-emoji">${hint}</div>` : `<div class="hint-text">${esc(hint)}</div>`}
      <div class="slots" id="slots">${slots.map((_, i) => `<button class="slot" data-i="${i}" aria-label="Letter ${i + 1}"></button>`).join('')}</div>
      <div class="tiles" id="tiles">${letters.map((l, i) => `<button class="tile" data-t="${i}">${l}</button>`).join('')}</div>
      <div class="row" style="width:100%;max-width:420px"><button class="btn ghost" id="hint">Hint</button><button class="btn ghost" id="skip">Skip</button></div>`;
    const slotEls = $$('.slot', ctx.stage), tileEls = $$('.tile', ctx.stage);
    const paint = () => {
      slotEls.forEach((s, i) => { s.textContent = slots[i] === null ? '' : letters[slots[i]]; s.classList.toggle('locked', locked.has(i)); });
      tileEls.forEach((t, i) => t.classList.toggle('used', slots.includes(i)));
    };
    const finish = ok => {
      busy = true;
      const f = ctx.timer.frac(); ctx.timer.stop();
      if (ok) { solved++; ctx.add(Math.max(5, 20 + Math.round(13 * f) - 5 * hints)); Sound.good(); $('#slots').classList.add('ok'); }
      else { Sound.bad(); slotEls.forEach((s, i) => { s.textContent = word[i]; }); $('#slots').classList.add('ok'); }
      ctx.later(next, ok ? 900 : 1800);
    };
    const check = () => {
      if (slots.includes(null)) return;
      if (slots.map(i => letters[i]).join('') === word) return finish(true);
      busy = true; Sound.bad(); buzz(60);
      $('#slots').classList.add('no');
      ctx.later(() => { $('#slots').classList.remove('no'); slots.forEach((_, i) => { if (!locked.has(i)) slots[i] = null; }); busy = false; paint(); }, 450);
    };
    const giveLetter = () => {
      const pos = word.split('').findIndex((ch, i) => !locked.has(i));
      if (pos < 0) return;
      slots.forEach((_, i) => { if (!locked.has(i)) slots[i] = null; });
      const t = letters.findIndex((l, i) => l === word[pos] && !slots.includes(i));
      slots[pos] = t; locked.add(pos); paint();
    };
    tileEls.forEach((t, i) => t.onclick = () => {
      if (busy || slots.includes(i)) return;
      const s = slots.indexOf(null); if (s < 0) return;
      slots[s] = i; Sound.tap(); paint(); check();
    });
    slotEls.forEach((s, i) => s.onclick = () => { if (busy || locked.has(i) || slots[i] === null) return; slots[i] = null; Sound.flip(); paint(); });
    $('#hint').onclick = () => { if (busy || locked.size >= word.length - 1) return; hints++; giveLetter(); Sound.tap(); check(); };
    $('#skip').onclick = () => { if (!busy) finish(false); };
    if (tier === 'star') giveLetter(); // free first letter for the youngest
    paint();
    ctx.timer.start(time, () => { if (!busy) finish(false); });
  };
  next();
}

/* ---------- Memory Match ---------- */
const MEM = ['🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐯', '🐷', '🐙', '🦄', '🐢', '🐧', '🦋', '🍉', '🍓', '🍌', '🚀', '⚽', '🎈', '🌈', '🍩'];
function memoryGame(ctx) {
  const cfg = { star: { pairs: 6, cols: 3, time: 100, peek: 2500 }, explorer: { pairs: 8, cols: 4, time: 90, peek: 1200 }, master: { pairs: 10, cols: 4, time: 80, peek: 0 } }[ctx.tier];
  const faces = shuffle(MEM).slice(0, cfg.pairs);
  const deck = shuffle([...faces, ...faces]);
  const rows = deck.length / cfg.cols;
  ctx.stage.innerHTML = `<div class="q-count" id="mstat">Find ${cfg.pairs} pairs</div>
    <div class="mgrid" style="--cols:${cfg.cols};--rows:${rows}">${deck.map((f, i) => `<button class="card${cfg.peek ? ' up' : ''}" data-i="${i}" aria-label="Card ${i + 1}"><span class="in"><span class="back"></span><span class="face">${f}</span></span></button>`).join('')}</div>`;
  const cards = $$('.card', ctx.stage);
  let open = [], found = 0, moves = 0, busy = true;
  const end = () => {
    busy = true;
    const f = found === cfg.pairs ? ctx.timer.frac() : 0; ctx.timer.stop();
    const eff = moves ? Math.min(1, cfg.pairs / moves) : 0;
    ctx.score = 0;
    ctx.add(50 * found / cfg.pairs + 30 * f + 20 * eff * found / cfg.pairs);
    if (found < cfg.pairs) { Sound.bad(); cards.forEach(c => c.classList.add('up')); }
    ctx.done([`${found} of ${cfg.pairs} pairs found`, `${moves} moves`]);
  };
  cards.forEach((c, i) => c.onclick = () => {
    if (busy || c.classList.contains('up') || c.classList.contains('done')) return;
    c.classList.add('up'); Sound.flip(); open.push(i);
    if (open.length < 2) return;
    moves++;
    const [a, b] = open; open = [];
    if (deck[a] === deck[b]) {
      found++;
      ctx.later(() => { cards[a].classList.add('done'); cards[b].classList.add('done'); Sound.good(); }, 250);
      $('#mstat').textContent = `${found} of ${cfg.pairs} pairs`;
      ctx.add(4);
      if (found === cfg.pairs) ctx.later(end, 600);
    } else {
      busy = true;
      ctx.later(() => { cards[a].classList.remove('up'); cards[b].classList.remove('up'); busy = false; }, 750);
    }
  });
  const begin = () => { cards.forEach(c => c.classList.remove('up')); busy = false; ctx.timer.start(cfg.time, end); };
  cfg.peek ? ctx.later(begin, cfg.peek) : begin();
}

function eyesGame(ctx) {
  const cfg = { star: { sizes: [3, 3, 4, 4, 4], time: 15 }, explorer: { sizes: [4, 4, 5, 5, 5], time: 11 }, master: { sizes: [5, 5, 6, 6, 6], time: 9 } }[ctx.tier];
  const sets = shuffle(EYES[ctx.tier]);
  let r = 0, right = 0;
  const next = () => {
    if (r >= cfg.sizes.length) return ctx.done([`${right} of ${cfg.sizes.length} spotted`]);
    const n = cfg.sizes[r], pair = shuffle(sets[r % sets.length]); r++;
    const odd = rand(0, n * n - 1);
    ctx.stage.innerHTML = `<div class="q-count">Find the different one · ${r} of ${cfg.sizes.length}</div>
      <div class="egrid" style="--n:${n}">${Array.from({ length: n * n }, (_, i) => `<button data-i="${i}">${i === odd ? pair[1] : pair[0]}</button>`).join('')}</div>`;
    const cells = $$('.egrid button', ctx.stage);
    let locked = false;
    const reveal = ok => {
      locked = true;
      const f = ctx.timer.frac(); ctx.timer.stop();
      cells[odd].classList.add('right');
      if (ok) { right++; ctx.add(10 + Math.round(10 * f)); Sound.good(); } else Sound.bad();
      ctx.later(next, ok ? 600 : 1300);
    };
    cells.forEach((c, i) => c.onclick = () => {
      if (locked) return;
      if (i === odd) return reveal(true);
      c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong');
      ctx.add(-3); Sound.bad(); buzz(60);
    });
    ctx.timer.start(cfg.time, () => reveal(false));
  };
  next();
}

const RUN = {
  math: ctx => quiz(ctx, t => pick(MATH[t])(), { star: 20, explorer: 15, master: 14 }[ctx.tier]),
  pattern: ctx => quiz(ctx, t => pick(PATTERN[t])(), { star: 20, explorer: 18, master: 18 }[ctx.tier]),
  words: wordGame,
  memory: memoryGame,
  eyes: eyesGame,
};

/* ---------- confetti ---------- */
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), g = cv.getContext('2d');
  cv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; g.scale(dpr, dpr);
  const colors = ['#FFC83D', '#FF6A5C', '#36D6A4', '#4AB3FF', '#B48CFF', '#FFF6E6'];
  const bits = Array.from({ length: 150 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(colors),
  }));
  const t0 = performance.now();
  const frame = now => {
    g.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => {
      b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g.restore();
    });
    if (now - t0 < 3500) requestAnimationFrame(frame);
    else { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
const start = () => go(home);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
