name: Test and deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ["family-game/**", ".github/workflows/family-game.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - run: npm ci
      # Builds the container image with Docker, pushes it to Cloudflare and deploys the Worker.
      # On failure the last lines of output are also posted as an annotation, visible on the run summary.
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            msg=$(grep -v '^\s*$' deploy.log | tail -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=wrangler deploy failed::${msg}"
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -n "$url" ]; then echo "::notice title=Deployed::${url}"; fi
      # After deploying, wait for the container and check the live site and both data sources.
      - name: Smoke test the live site
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          [ -n "$url" ] || { echo "::warning title=Smoke test::no workers.dev URL found in deploy output"; exit 0; }
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$url/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error title=Smoke test::$url/healthz did not respond within 5 minutes"; exit 1; }
          check() {
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 150 "$url$1")
            info=$(jq -r 'if .error then "error: \(.error|tostring|.[0:300])" elif .report then "\(.symbol) close \(.report.close) on \(.report.date), \(.report.verdict) (source \(.source))" elif .count then "\(.count) companies" else "ok" end' body.json 2>/dev/null | tr '\n' ' ')
            echo "::notice title=$2::HTTP $code - $info"
          }
          echo "::notice title=Site::$url is up"
          check "/api/analyze/2222?source=tadawul" "Saudi Exchange source (2222)"
          check "/api/analyze/2222?source=yahoo" "Yahoo source (2222)"
          check "/api/market" "Market feed"

      # On failure, show which accounts and permissions the token has (account IDs matching the secret print as ***).
      - name: Diagnose Cloudflare token
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          verify=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          accounts=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '[.result[]? | "\(.name) (\(.id))"] | join(", ")')
          scripts=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "::warning title=Token check::verify=${verify} | accounts the token can see: ${accounts:-none} | list Workers in configured account: HTTP ${scripts}"
